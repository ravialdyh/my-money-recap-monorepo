version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks: [hugeParam, rangeValCopy]
    gosec:
      excludes:
        # G115 fires on every int -> int32 in the generated protobuf boundary.
        - G115
    govet:
      enable-all: true
      disable: [fieldalignment, shadow]
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: receiver-naming
        - name: unexported-return
    staticcheck:
      checks: ["all"]
  exclusions:
    generated: strict
    presets: [comments, common-false-positives, legacy, std-error-handling]
    rules:
      # Test helpers and table-driven tests use dot-style assertions and long bodies.
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, contextcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/ravialdyh/my-money-recap-monorepo]
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
