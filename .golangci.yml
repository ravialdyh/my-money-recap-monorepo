version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks: [hugeParam, rangeValCopy]
    gosec:
      excludes:
        # G115 fires on every int -> int32 at the generated protobuf boundary.
        - G115
    govet:
      enable-all: true
      disable: [fieldalignment, shadow]
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    # checks: all turns on the ST group, which covers package comments, naming, error strings and
    # receiver names. revive would repeat all of it, so revive is not enabled.
    staticcheck:
      checks: ["all"]
  exclusions:
    generated: strict
    # The comments preset drops every "should have a comment" finding: comment style is
    # tools/policy's job, and two tools with different opinions about comments is how the old
    # revive block ended up enabled but silently suppressed.
    presets: [comments, common-false-positives, legacy, std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, contextcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/ravialdyh/my-money-recap-monorepo]
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
