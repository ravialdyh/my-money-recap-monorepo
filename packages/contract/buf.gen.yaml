version: v2
clean: true
inputs:
  - directory: .
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../../apps/backend/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.21.0
    out: ../../apps/backend/gen
    opt: paths=source_relative
  - remote: buf.build/apple/swift:v1.38.1
    out: swift/Sources/MoneyRecapContract
    types: [money_recap.v1.BffService, money_recap.v1.EmailBounced]
    opt: Visibility=Public
  - remote: buf.build/connectrpc/swift:v1.2.3
    out: swift/Sources/MoneyRecapContract
    types: [money_recap.v1.BffService, money_recap.v1.EmailBounced]
    opt:
      - Visibility=Public
      - GenerateAsyncMethods=true
      - GenerateCallbackMethods=false
