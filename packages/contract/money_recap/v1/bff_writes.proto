syntax = "proto3";

package money_recap.v1;

option go_package = "github.com/ravialdyh/my-money-recap-monorepo/apps/backend/gen/money_recap/v1;moneyrecapv1";

import "money_recap/v1/bff_views.proto";
import "money_recap/v1/money.proto";
import "money_recap/v1/shared.proto";

// The Log a spend sheet (PRD §6.9).
message BffServiceLogSpendRequest {
  // Above zero, at most 11 digits before the separator (PRD D57).
  Money amount = 1;
  // One of the eight (PRD §6.9); UNSPECIFIED is invalid_argument.
  Category category = 2;
  // "YYYY-MM-DD", within the last 60 days including today (PRD §8.10).
  string date = 3;
  // Optional, at most 80 characters (PRD §6.9).
  string note = 4;
}

// The fresh HomeView of §6.2 step 5, whose target_warning is the banner if
// this Spend crossed the line, and the Spend as stored.
message BffServiceLogSpendResponse {
  HomeView home = 1;
  Spend spend = 2;
}

// The edit sheet (PRD §6.10): every field is the new value, validated as
// LogSpend validates it.
message BffServiceEditSpendRequest {
  string spend_id = 1;
  // Above zero, at most 11 digits before the separator (PRD D57).
  Money amount = 2;
  // One of the eight (PRD §6.9); UNSPECIFIED is invalid_argument.
  Category category = 3;
  // "YYYY-MM-DD" within the last 60 days including today, or the stored date
  // unchanged when the Spend is already older than that (PRD §8.10, §6.10).
  string date = 4;
  // Optional, at most 80 characters (PRD §6.9).
  string note = 5;
}

// The fresh HomeView and the Spend after the edit. A past month's Recap
// changes at once (D22) and is fetched again on open.
message BffServiceEditSpendResponse {
  HomeView home = 1;
  Spend spend = 2;
}

message BffServiceDeleteSpendRequest {
  string spend_id = 1;
}

message BffServiceDeleteSpendResponse {
  HomeView home = 1;
}

// Onboarding step 3 and Settings > Salary and Payday (PRD §6.6, §6.16).
message BffServiceSaveSalaryRequest {
  // Above zero, at most 11 digits before the separator (PRD D57).
  Money amount = 1;
  // 1 to 31, or "last" (PRD D51).
  string payday = 2;
  // The D56 sheet's answer; UNSPECIFIED when the sheet did not open, passed
  // to ledger as is: failed_precondition on or after Payday means the phone
  // must open the sheet (PRD §8.10).
  SalaryAppliesFrom applies_from = 3;
}

// The fresh HomeView and the Settings rows after the append, which name the
// month a later-effective row starts from (D56).
message BffServiceSaveSalaryResponse {
  HomeView home = 1;
  SettingsView settings = 2;
}

// Onboarding step 4 and Settings > Saving Target (PRD §6.7, §6.16, D65).
message BffServiceSaveTargetRequest {
  // 0 to 100 in steps of 5; 0 clears the Saving Target (PRD §8.4).
  int32 percent = 1;
}

message BffServiceSaveTargetResponse {
  HomeView home = 1;
  SettingsView settings = 2;
}

// The confirm sheet's Convert, or the direct change when the preview said
// nothing_to_convert (PRD §8.9 steps 2 and 4).
message BffServiceChangeCurrencyRequest {
  // ISO 4217 code to convert into.
  string to_currency_code = 1;
  // preview.rate as the confirm sheet showed it, a decimal string; empty
  // only when the preview said nothing_to_convert.
  string rate = 2;
  // Where rate came from, as the preview answered it; UNSPECIFIED only when
  // rate is empty.
  RateSource source = 3;
}

// The fresh HomeView and the Settings rows, every amount now in the new
// Currency.
message BffServiceChangeCurrencyResponse {
  HomeView home = 1;
  SettingsView settings = 2;
}
