syntax = "proto3";

package money_recap.v1;

option go_package = "github.com/ravialdyh/my-money-recap-monorepo/apps/backend/gen/money_recap/v1;moneyrecapv1";

import "google/protobuf/timestamp.proto";
import "money_recap/v1/money.proto";

enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_SNACKS = 1;
  CATEGORY_GAMES = 2;
  CATEGORY_TOYS = 3;
  CATEGORY_RIDES = 4;
  CATEGORY_CLOTHES = 5;
  CATEGORY_BILLS = 6;
  CATEGORY_GIFTS = 7;
  CATEGORY_OTHER = 8;
}

enum Archetype {
  ARCHETYPE_UNSPECIFIED = 0;
  ARCHETYPE_SQUIRREL = 1;
  ARCHETYPE_HUSTLER = 2;
  ARCHETYPE_TREAT_YOURSELF = 3;
  ARCHETYPE_SLOW_BURNER = 4;
}

enum SalaryAppliesFrom {
  SALARY_APPLIES_FROM_UNSPECIFIED = 0;
  SALARY_APPLIES_FROM_THIS_MONTH = 1;
  SALARY_APPLIES_FROM_NEXT_MONTH = 2;
}

enum RateSource {
  RATE_SOURCE_UNSPECIFIED = 0;
  RATE_SOURCE_PROVIDER = 1;
  RATE_SOURCE_MANUAL = 2;
}

message Spend {
  string id = 1;
  Money amount = 2;
  Money original_amount = 3;
  Category category = 4;
  string date = 5;
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message EventEnvelope {
  string message_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string member_id = 3;
  string routing_key = 4;
}

message SalaryFacts {
  Money amount = 1;
  string payday = 2;
  int32 days_until_payday = 3;
}

message SavingTargetFacts {
  int32 percent = 1;
  Money amount = 2;
  string progress_sentence = 3;
}

message TargetWarning {
  string message = 1;
}

message RecapMonth {
  string month = 1;
  string label = 2;
}
