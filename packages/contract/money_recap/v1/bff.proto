syntax = "proto3";

package money_recap.v1;

option go_package = "github.com/ravialdyh/my-money-recap-monorepo/apps/backend/gen/money_recap/v1;moneyrecapv1";

import "money_recap/v1/bff_account.proto";
import "money_recap/v1/bff_reads.proto";
import "money_recap/v1/bff_views.proto";
import "money_recap/v1/bff_writes.proto";

message GetHomeRequest {}

message GetHomeResponse {
  HomeView home = 1;
}

// The only service the phone talks to (ARCHITECTURE §6); answers are stored
// whole (I4). No request carries an idempotency key: shared.proto's package
// doc says where the BFF gets one.
service BffService {
  // Sent without a bearer token. resource_exhausted past 5 per email per hour
  // or when the count fails (PRD §11, §6.3); invalid_argument for an address
  // that does not parse or the mail host refuses; unavailable when the realm or
  // the send fails (§7.5).
  rpc RequestMagicLink(BffServiceRequestMagicLinkRequest) returns (BffServiceRequestMagicLinkResponse) {}
  // Home always shows the current month (PRD §6.8, D59), so no month argument.
  // failed_precondition until steps 1 and 2 are answered: Home greets by name
  // and prints every amount in the Member's Currency (spec #92).
  rpc GetHome(GetHomeRequest) returns (GetHomeResponse) {}
  // One month's full or Partial Recap, or the current month's preview (D47).
  rpc GetRecap(BffServiceGetRecapRequest) returns (BffServiceGetRecapResponse) {}
  rpc ListRecapMonths(BffServiceListRecapMonthsRequest) returns (BffServiceListRecapMonthsResponse) {}
  rpc ListSpends(BffServiceListSpendsRequest) returns (BffServiceListSpendsResponse) {}
  // The §6.2 flow: ledger writes, notify evaluates the warning, a fresh
  // HomeView comes back. invalid_argument on a D57, §8.10 or §6.9 breach.
  rpc LogSpend(BffServiceLogSpendRequest) returns (BffServiceLogSpendResponse) {}
  rpc EditSpend(BffServiceEditSpendRequest) returns (BffServiceEditSpendResponse) {}
  rpc DeleteSpend(BffServiceDeleteSpendRequest) returns (BffServiceDeleteSpendResponse) {}
  // Where onboarding resumes after a force-quit (PRD §6.4).
  rpc GetOnboardingState(BffServiceGetOnboardingStateRequest) returns (BffServiceGetOnboardingStateResponse) {}
  // One members.SaveProfile carrying the answers and the step: one write under
  // the one Idempotency-Key (A14).
  rpc SaveProfile(BffServiceSaveProfileRequest) returns (BffServiceSaveProfileResponse) {}
  // Called on every launch (A3); the answer drives the restore sheet (D60).
  rpc SetTimezone(BffServiceSetTimezoneRequest) returns (BffServiceSetTimezoneResponse) {}
  rpc GetSettings(BffServiceGetSettingsRequest) returns (BffServiceGetSettingsResponse) {}
  // ledger.SaveSalary with applies_from passed through as sent, UNSPECIFIED
  // included; failed_precondition when the D56 sheet should have opened.
  // During onboarding it is a setup save, and step 3 is then recorded in
  // members, after ledger answers (spec #92).
  rpc SaveSalary(BffServiceSaveSalaryRequest) returns (BffServiceSaveSalaryResponse) {}
  // ledger.SaveTarget: the first takes effect in the sign-up month, later ones
  // next month (D65); failed_precondition without a Salary (D44).
  rpc SaveTarget(BffServiceSaveTargetRequest) returns (BffServiceSaveTargetResponse) {}
  // currency.Quote then ledger.PreviewConversion; unavailable when the rate
  // fetch fails, the Retry InlineError (PRD §8.9 step 1).
  rpc PreviewCurrencyChange(BffServicePreviewCurrencyChangeRequest) returns (BffServicePreviewCurrencyChangeResponse) {}
  // ledger.ApplyCurrencyConversion, or members.SaveProfile when there is
  // nothing to convert (PRD §8.9 steps 2 and 4).
  rpc ChangeCurrency(BffServiceChangeCurrencyRequest) returns (BffServiceChangeCurrencyResponse) {}
  rpc SaveNotificationPrefs(BffServiceSaveNotificationPrefsRequest) returns (BffServiceSaveNotificationPrefsResponse) {}
  rpc RegisterDevice(BffServiceRegisterDeviceRequest) returns (BffServiceRegisterDeviceResponse) {}
  // ledger.ExportCSV then notify.EmailExport (§7.3). failed_precondition with
  // EmailBounced is the §6.16 InlineError offering Profile.
  rpc RequestExport(BffServiceRequestExportRequest) returns (BffServiceRequestExportResponse) {}
  // Stamps the request; the phone signs out on the answer (§7.1 step 1).
  rpc RequestDeletion(BffServiceRequestDeletionRequest) returns (BffServiceRequestDeletionResponse) {}
  // Clears the stamp inside the 24-hour window (§7.1 step 2, D60).
  rpc CancelDeletion(BffServiceCancelDeletionRequest) returns (BffServiceCancelDeletionResponse) {}
}
