syntax = "proto3";

package money_recap.v1;

option go_package = "github.com/ravialdyh/my-money-recap-monorepo/apps/backend/gen/money_recap/v1;moneyrecapv1";

import "google/protobuf/timestamp.proto";
import "money_recap/v1/shared.proto";

// The three toggles and the reminder time from PRD §6.16 and §10. notify
// fills every field on read: a Member with no row gets the PRD §10 defaults,
// never proto3 zeros. The push-permission state lives on the phone, not here.
message NotificationPrefs {
  // "Recap ready", default on (PRD §10).
  bool recap_ready = 1;
  // "Daily reminder", default off (PRD §10).
  bool daily_reminder = 2;
  // "HH:MM" in the Member's local zone (A3), default "20:00" (PRD §6.16).
  string reminder_time = 3;
  // "Target Warning", default on (PRD §10).
  bool target_warning = 4;
}

// Typed error detail on EmailExport (ARCHITECTURE §7.3): the mail host
// permanently refused the address at bounced_at, so the phone shows the §6.16
// line naming it, with no link.
message EmailBounced {
  string address = 1;
  google.protobuf.Timestamp bounced_at = 2;
}

message GetWarningStateRequest {
  string member_id = 1;
  // "YYYY-MM".
  string month = 2;
}

// Whether the Target Warning has fired this month and the copy kept when it
// did (PRD §8.8, ARCHITECTURE §7.3).
message GetWarningStateResponse {
  bool fired = 1;
  // The copy kept when the month was stamped; present whenever fired. Deleting
  // or editing Spends never clears it (PRD §8.8): Home's banner is this.
  optional TargetWarning warning = 2;
}

message EvaluateWarningRequest {
  // A14; see the package doc in shared.proto.
  string idempotency_key = 1;
  string member_id = 2;
  // "YYYY-MM".
  string month = 3;
  // Computed by ledger (ARCHITECTURE §7.2); notify holds no PRD §8 rule.
  bool crossed_line = 4;
  // Ledger's MonthSummary.target_warning as this Spend left it; kept with the
  // stamp, so the banner reads the same until the 1st (PRD §6.8, §8.8).
  optional TargetWarning warning = 5;
}

// The warning state after the call (ARCHITECTURE §6.2 step 4), so the BFF
// builds a current-month write's HomeView banner without a second round trip.
message EvaluateWarningResponse {
  // True when the month is stamped, by this call or an earlier one.
  bool fired = 1;
  // True when this call stamped the month, so exactly one call per month
  // sees it (PRD §8.8).
  bool fired_now = 2;
  // The copy kept when the month was stamped, by this call or an earlier one;
  // present whenever fired. It reads the same until the 1st (PRD §8.8).
  optional TargetWarning warning = 3;
}

message GetPrefsRequest {
  string member_id = 1;
}

message GetPrefsResponse {
  NotificationPrefs prefs = 1;
}

message SavePrefsRequest {
  // A14; see the package doc in shared.proto.
  string idempotency_key = 1;
  string member_id = 2;
  NotificationPrefs prefs = 3;
}

message SavePrefsResponse {
  NotificationPrefs prefs = 1;
}

message RegisterDeviceRequest {
  // A14; see the package doc in shared.proto.
  string idempotency_key = 1;
  string member_id = 2;
  // The APNs device token as hex; a 410 from Apple deletes the row
  // (ARCHITECTURE §7.3).
  string apns_token = 3;
}

message RegisterDeviceResponse {}

message EmailMagicLinkRequest {
  // A14; see the package doc in shared.proto. Dedupes a retried send.
  string idempotency_key = 1;
  // The address the BFF parsed from the request, because no Member row may
  // exist yet (ARCHITECTURE §7.3).
  string email = 2;
  // The full https://…/magic?lt=… link the BFF built (ARCHITECTURE §7.5).
  string link = 3;
}

message EmailMagicLinkResponse {}

message EmailExportRequest {
  // A14; see the package doc in shared.proto. Claimed with the send.
  string idempotency_key = 1;
  string member_id = 2;
  // Every non-deleted Spend as CSV, straight from ledger.ExportCSV; never
  // stored (ARCHITECTURE §7.3, PRD D39). The address comes from member_facts.
  bytes csv = 3;
}

message EmailExportResponse {}

// Notifications, device tokens, preferences, the Target Warning stamp and
// every outbound email (ARCHITECTURE §7.3). Optional on every Member path;
// RequestMagicLink and RequestExport require it (A14).
service NotifyService {
  rpc GetWarningState(GetWarningStateRequest) returns (GetWarningStateResponse) {}
  // Stamps month_flag when crossed_line and unstamped, then pushes if the
  // stamp is fresh (PRD §8.8).
  rpc EvaluateWarning(EvaluateWarningRequest) returns (EvaluateWarningResponse) {}
  rpc GetPrefs(GetPrefsRequest) returns (GetPrefsResponse) {}
  // Each toggle writes immediately (PRD §6.16); the key dedupes a retry (A14).
  rpc SavePrefs(SavePrefsRequest) returns (SavePrefsResponse) {}
  // Upserts the device row on the token (A14).
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse) {}
  // Errors (ARCHITECTURE §7.3, §7.5): invalid_argument for an empty key or an
  // address the mail host permanently refuses; unavailable for any other
  // send failure.
  rpc EmailMagicLink(EmailMagicLinkRequest) returns (EmailMagicLinkResponse) {}
  // Reads the address from member_facts. Errors (ARCHITECTURE §7.3):
  // failed_precondition with EmailBounced when the mail host permanently
  // refuses the address; unavailable for any other send failure.
  rpc EmailExport(EmailExportRequest) returns (EmailExportResponse) {}
}
