included:
  - apps/ios
  - packages/contract/swift/Package.swift
excluded:
  - apps/ios/build
  - apps/ios/DesignSystem/Tokens.swift

opt_in_rules:
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool

disabled_rules:
  - function_body_length
  - file_length
  - todo
  - trailing_comma

identifier_name:
  min_length:
    warning: 1
