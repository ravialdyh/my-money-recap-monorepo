<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif; }
    a { color: #1E1B3A; } a:hover { color: #5B4FE8; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F0665A; position: relative; overflow: hidden; box-sizing: border-box; padding: 56px 24px 28px 24px; display: flex; flex-direction: column; color: #FFFFFF; font-family: 'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif;">

  <div style="display: flex; flex-direction: row; gap: 8px; align-items: center;">
    <div style="background: #FFFFFF; color: #1E1B3A; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 14px; border-radius: 999px;">Goal</div>
    <div style="background: #1E1B3A; color: #FFFFFF; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 14px; border-radius: 999px;">Spending</div>
  </div>

  <h1 style="margin: 20px 0 0 0; font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Nunito', sans-serif; font-weight: 700; font-size: 40px; line-height: 1.04; letter-spacing: -0.01em; color: #FFFFFF; text-wrap: balance;">68% of the way to the skateboard</h1>
  <p style="margin: 10px 0 0 0; font-size: 16px; font-weight: 700; line-height: 1.4; color: #FFFFFF; opacity: 0.85;">About 3 weeks to go at this rate.</p>

  <div style="background: #FFFFFF; color: #1E1B3A; border-radius: 28px; padding: 22px 22px 22px 22px; display: flex; flex-direction: column; gap: 14px; margin-top: 22px;">
    <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: baseline;">
      <div style="font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Nunito', sans-serif; font-weight: 600; font-size: 20px;">Skateboard fund</div>
      <div style="font-size: 14px; font-weight: 800; color: #6B6890;"><span style="color: #1E1B3A; font-size: 18px;">£41</span> of £60</div>
    </div>
    <div style="position: relative; height: 22px; border-radius: 999px; background: #FFE3E0; margin-top: 14px;">
      <div style="position: absolute; left: 0; top: 0; height: 22px; width: 68%; border-radius: 999px; background: #F0665A;"></div>
      <div style="position: absolute; left: 68%; top: -30px; transform: translateX(-50%);">
        <svg width="64" height="30" viewBox="0 0 64 30" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block;">
          <path d="M6 8 C6 4, 10 4, 12 6 L52 6 C54 4, 58 4, 58 8 C58 12, 54 12, 52 12 L12 12 C10 12, 6 12, 6 8 Z" fill="#5B4FE8"/>
          <rect x="4" y="5" width="56" height="9" rx="4.5" fill="#5B4FE8"/>
          <rect x="14" y="14" width="10" height="4" rx="1" fill="#6B6890"/>
          <rect x="40" y="14" width="10" height="4" rx="1" fill="#6B6890"/>
          <circle cx="16" cy="22" r="6" fill="#F7C948"/><circle cx="16" cy="22" r="2.5" fill="#1E1B3A"/>
          <circle cx="48" cy="22" r="6" fill="#F7C948"/><circle cx="48" cy="22" r="2.5" fill="#1E1B3A"/>
        </svg>
      </div>
    </div>
    <div style="font-size: 13px; font-weight: 700; color: #6B6890;">£19 to go. Keep saving £25 a month and it's yours by 25 October.</div>
  </div>

  <div style="background: #FFFFFF; color: #1E1B3A; border-radius: 28px; padding: 22px 0 22px 22px; display: flex; flex-direction: row; gap: 6px; margin-top: 14px; flex-grow: 1; position: relative; overflow: visible;">
    <div style="display: flex; flex-direction: column; gap: 14px; flex-grow: 1; min-width: 0;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 14px; font-weight: 800; color: #6B6890;">Where £11 went</div>
        <div style="font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Nunito', sans-serif; font-weight: 600; font-size: 20px; line-height: 1.1;">Mostly snacks</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 800;"><span>Snacks</span><span style="color: #6B6890;">45%</span></div>
          <div style="height: 16px; border-radius: 999px; background: #FFE3E0;"><div style="height: 16px; width: 45%; border-radius: 999px; background: #F0665A;"></div></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 800;"><span>Games</span><span style="color: #6B6890;">36%</span></div>
          <div style="height: 16px; border-radius: 999px; background: #EFE9FF;"><div style="height: 16px; width: 36%; border-radius: 999px; background: #5B4FE8;"></div></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 800;"><span>Toys</span><span style="color: #6B6890;">19%</span></div>
          <div style="height: 16px; border-radius: 999px; background: #FFF3CC;"><div style="height: 16px; width: 19%; border-radius: 999px; background: #F7C948;"></div></div>
        </div>
      </div>
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 8px;">
        <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #F0665A;">The splurge</div>
        <div style="font-size: 15px; font-weight: 800; line-height: 1.3;">£4 on a new game. Your biggest single buy.</div>
      </div>
    </div>
    <div style="width: 168px; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: center; margin-top: -60px; margin-bottom: 0;">
      <img src="../assets/illustrations/ill-vending.webp" alt="" style="width: 168px; height: auto; display: block;">
    </div>
  </div>

  <div style="display: flex; justify-content: center; gap: 6px; margin-top: 18px;">
    <span style="width: 6px; height: 6px; border-radius: 999px; background: #FFFFFF; opacity: 0.45; display: inline-block;"></span>
    <span style="width: 6px; height: 6px; border-radius: 999px; background: #FFFFFF; opacity: 0.45; display: inline-block;"></span>
    <span style="width: 22px; height: 6px; border-radius: 999px; background: #FFFFFF; display: inline-block;"></span>
    <span style="width: 6px; height: 6px; border-radius: 999px; background: #FFFFFF; opacity: 0.45; display: inline-block;"></span>
  </div>
</div>
</x-dc>
</body>
</html>
