version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(ci)" }
    groups:
      actions: { patterns: ["*"], update-types: ["minor", "patch"] }

  - package-ecosystem: gomod
    directory: /apps/backend
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(backend)" }
    groups:
      go: { patterns: ["*"], update-types: ["minor", "patch"] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(ds)" }
    groups:
      node: { patterns: ["*"], update-types: ["minor", "patch"] }

  - package-ecosystem: swift
    directory: /packages/contract/swift
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(contract)" }

  - package-ecosystem: docker
    directory: /apps/backend
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(backend)" }

  - package-ecosystem: pre-commit
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(hooks)" }
    groups:
      hooks: { patterns: ["*"], update-types: ["minor", "patch"] }
