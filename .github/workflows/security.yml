name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
            deps:
              - '.github/workflows/security.yml'
              - 'apps/backend/go.mod'
              - 'apps/backend/go.sum'
              - 'apps/ios/**/Package.resolved'
              - 'package-lock.json'
              - 'package.json'
              - 'packages/contract/swift/**'

  dependencies:
    name: dependency advisories
    needs: changes
    if: needs.changes.outputs.deps == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: govulncheck, which reports only advisories this code actually reaches
        working-directory: apps/backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: npm audit
        run: |
          npm ci
          npm audit --audit-level=high
      - name: OSV for Go, npm and Swift Package Manager from one database
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=apps/backend/go.mod
            --lockfile=package-lock.json
            --lockfile=apps/ios/MyMoneyRecap.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

  secrets:
    name: secrets in the whole tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Gitleaks over every tracked file, not the staged diff the hook sees
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --redact --no-banner
          ./gitleaks git . --redact --no-banner

  code:
    name: static analysis
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.145.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Semgrep community rules, no account
        run: |
          semgrep scan --config=p/default --config=p/secrets \
            --config=p/golang --config=p/typescript --config=p/dockerfile \
            --error --metrics=off \
            --exclude=apps/backend/gen --exclude=packages/contract/swift/Sources \
            --exclude=node_modules --exclude='*.generated.ts' .

  filesystem:
    name: trivy
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Vulnerabilities and secrets in the tree
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: node_modules,apps/backend/gen,packages/contract/swift/Sources
      - name: Misconfiguration in the Dockerfile, the only format here Trivy config covers
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: node_modules

  security:
    name: all green
    if: always()
    needs: [changes, dependencies, secrets, code, filesystem]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed or had nothing to do
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in
              success|skipped) ;;
              *) echo "a needed job reported: $result" && exit 1 ;;
            esac
          done
