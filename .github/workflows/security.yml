name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: govulncheck, which reports only advisories this code actually reaches
        working-directory: apps/backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - name: OSV for Go, npm and Swift Package Manager from one database
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=apps/backend/go.mod
            --lockfile=package-lock.json
            --lockfile=apps/ios/MyMoneyRecap.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

  secrets:
    name: secrets in the whole tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks over every tracked file, not the staged diff the hook sees
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --redact --no-banner
          ./gitleaks git . --redact --no-banner

  code:
    name: static analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.145.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep community rules, no account
        run: |
          semgrep scan --config=p/default --config=p/secrets \
            --config=p/golang --config=p/typescript --config=p/dockerfile \
            --error --metrics=off \
            --exclude=apps/backend/gen --exclude=packages/contract/swift/Sources \
            --exclude=node_modules --exclude='*.generated.ts' .

  filesystem:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vulnerabilities and secrets in the tree
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: node_modules,apps/backend/gen,packages/contract/swift/Sources
      - name: Misconfiguration in the Dockerfile and the OpenTofu realm root, the formats here Trivy config covers
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: node_modules

  security:
    name: all green
    if: always()
    needs: [dependencies, secrets, code, filesystem]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed or had nothing to do
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in
              success|skipped) ;;
              *) echo "a needed job reported: $result" && exit 1 ;;
            esac
          done
