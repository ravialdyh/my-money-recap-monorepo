name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tokens and stylesheet are up to date with tokens.json
        run: |
          npm run build:tokens
          git diff --exit-code -- my-money-recap-ds/src/tokens my-money-recap-ds/src/styles
      - name: Swift tokens are up to date with tokens.json
        run: |
          npm run build:swift-tokens
          git diff --exit-code -- apps/ios/DesignSystem
      - name: Inlined artwork is up to date with assets/illustrations
        run: |
          npm run build:assets
          git diff --exit-code -- my-money-recap-ds/src/assets
      - run: npm run typecheck

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contract
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
      - run: buf lint
      - name: No breaking change against main (A1)
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git cat-file -e origin/main:packages/contract/buf.yaml 2>/dev/null; then
            buf breaking --against "$(git rev-parse --git-common-dir)#ref=origin/main,subdir=packages/contract"
          else
            echo "packages/contract is not on main yet; nothing to compare against"
          fi
      - name: Generated Go and Swift code is up to date with the .proto files
        run: |
          buf generate
          git diff --exit-code -- ../../apps/backend/gen swift/Sources
      - name: Generated Go compiles
        working-directory: apps/backend
        run: go build ./...

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Compose stack with the migration step and members (#15)
        working-directory: infra/compose
        run: |
          printf 'POSTGRES_PASSWORD=ci\nKEYCLOAK_DB_PASSWORD=ci\nMEMBERS_DB_PASSWORD=ci\nKC_BOOTSTRAP_ADMIN_USERNAME=admin\nKC_BOOTSTRAP_ADMIN_PASSWORD=ci\nTEST_USER_PASSWORD=ci\nBFF_CLIENT_SECRET=ci\n' > .env
          docker compose up -d --build --wait
      - name: Connect-boundary tests against Compose
        env:
          MEMBERS_TEST_URL: http://localhost:8081
          MEMBERS_TEST_DATABASE_URL: postgres://members:ci@localhost:5432/members
          MEMBERS_TEST_KEYCLOAK: http://localhost:8080
          MEMBERS_TEST_USER_PASSWORD: ci
          MEMBERS_TEST_BFF_CLIENT_SECRET: ci
        run: go test -v -run 'TestConcurrentFirstCallsCreateOneRow|TestConnectBoundary' ./internal/members/
      - name: Stack logs and teardown
        if: always()
        working-directory: infra/compose
        run: |
          docker compose ps
          docker compose logs members-migrate members
          docker compose down -v

  a10-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway .env (development credentials only, never committed)
        run: sed 's/=$/=ci-throwaway/' infra/compose/.env.example > infra/compose/.env
      - name: Keycloak and Postgres only; members is the backend job's concern
        run: docker compose -f infra/compose/compose.yaml up -d --wait --wait-timeout 300 keycloak
      - name: Login Token issued and redeemed on the pinned image (A10)
        run: infra/compose/a10-smoke.sh
      - if: failure()
        run: docker compose -f infra/compose/compose.yaml logs keycloak
