name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      contract: ${{ steps.filter.outputs.contract }}
      design-system: ${{ steps.filter.outputs.design-system }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - '.github/workflows/ci.yml'
              - '.golangci.yml'
              - 'apps/backend/**'
              - 'infra/**'
              - 'packages/contract/**'
              - 'tools/coverage/**'
            contract:
              - '.github/workflows/ci.yml'
              - 'apps/backend/gen/**'
              - 'packages/contract/**'
            design-system:
              - '.github/workflows/ci.yml'
              - 'apps/ios/DesignSystem/Tokens.swift'
              - 'biome.json'
              - 'my-money-recap-ds/**'
              - 'my-money-recap/assets/illustrations/**'
              - 'package-lock.json'
              - 'package.json'
              - 'tools/coverage/**'
            ios:
              - '.github/workflows/ci.yml'
              - '.swiftformat'
              - '.swiftlint.yml'
              - 'apps/ios/**'
              - 'packages/contract/**'
              - 'tools/coverage/**'

  quality:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install hadolint, whose hook is a silent skip when the binary is absent
        run: |
          curl -sSfL -o hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint" | sha256sum -c -
          chmod +x hadolint && sudo mv hadolint /usr/local/bin/
      - name: Every hook except the per-language toolchains, which are gates in their own jobs
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: no-commit-to-branch,golangci-lint,gofmt,swiftlint,swiftformat,buf-lint,tofu-fmt,tofu-validate

  design-system:
    needs: changes
    if: needs.changes.outputs.design-system == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tokens and stylesheet are up to date with tokens.json
        run: |
          npm run build:tokens
          git diff --exit-code -- my-money-recap-ds/src/tokens my-money-recap-ds/src/styles
      - name: Swift tokens are up to date with tokens.json
        run: |
          npm run build:swift-tokens
          git diff --exit-code -- apps/ios/DesignSystem
      - name: Inlined artwork is up to date with assets/illustrations
        run: |
          npm run build:assets
          git diff --exit-code -- my-money-recap-ds/src/assets
      - run: npm run typecheck
      - name: Unit tests with coverage
        working-directory: my-money-recap-ds
        run: npm run test:coverage
      - name: Coverage may not fall, see tools/coverage/README.md
        run: |
          pct=$(python3 -c "import json;print(json.load(open('my-money-recap-ds/coverage/coverage-summary.json'))['total']['statements']['pct'])")
          python3 tools/coverage/coverage_gate.py typescript "$pct"

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: 1.73.0
          setup_only: true
      - run: buf lint
      - name: No breaking change against main, decision A1
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          buf breaking --against "$(git rev-parse --git-common-dir)#ref=origin/main,subdir=packages/contract"
      - name: Generated Go and Swift are up to date with the proto files
        run: |
          buf generate
          git diff --exit-code -- ../../apps/backend/gen swift/Sources

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      MEMBERS_TEST_URL: http://localhost:8081
      MEMBERS_TEST_DATABASE_URL: postgres://members:ci-throwaway@localhost:5432/members
      MEMBERS_TEST_KEYCLOAK: http://localhost:8080
      MEMBERS_TEST_USER_PASSWORD: ci-throwaway
      MEMBERS_TEST_BFF_CLIENT_SECRET: ci-throwaway
      BFF_TEST_URL: http://localhost:8082
      BFF_TEST_KEYCLOAK: http://localhost:8080
      BFF_TEST_USER_PASSWORD: ci-throwaway
      BFF_TEST_DATABASE_URL: postgres://members:ci-throwaway@localhost:5432/members
      NOTIFY_TEST_URL: http://localhost:8083
      NOTIFY_TEST_MAILPIT: http://localhost:8025
      NOTIFY_TEST_SMTP: localhost:1025
      NOTIFY_TEST_DATABASE_URL: postgres://notify:ci-throwaway@localhost:5432/notify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          working-directory: apps/backend
          args: --config ../../.golangci.yml
      - name: Install OpenTofu, whose two hooks the pre-commit job skips
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o tofu.zip \
            https://github.com/opentofu/opentofu/releases/download/v1.12.6/tofu_1.12.6_linux_amd64.zip
          echo "5dc43da4f750f33873dc25e94587128709e819e544b7be9016b255316153c3a8  tofu.zip" | sha256sum -c -
          unzip -q tofu.zip tofu && chmod +x tofu && sudo mv tofu /usr/local/bin/
      - name: The OpenTofu roots are formatted and valid
        run: |
          ../../tools/hooks/tofu.sh fmt -check -diff
          ../../tools/hooks/tofu.sh validate
      - name: Install sops and age, pinned and checksummed like hadolint in the quality job
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  sops" | sha256sum -c -
          chmod +x sops && sudo mv sops /usr/local/bin/
          curl -sSfL -o age.tgz \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age.tgz" | sha256sum -c -
          tar -xzf age.tgz && sudo mv age/age age/age-keygen /usr/local/bin/
      - name: Secrets decrypt to one file per value at mode 0400, decision A13
        working-directory: infra/secrets
        run: ./decrypt-smoke.sh
      - name: Compose stack with the migration steps, the realm, members, notify, Mailpit and the BFF
        working-directory: infra/compose
        run: |
          sed 's/=$/=ci-throwaway/' .env.example > .env
          docker compose --profile mail up -d --build --wait
      - name: Go tests; -p 1 because members and bff both sign in as the realm's one test user
        run: |
          go vet ./...
          go test -v -p 1 -covermode=atomic -coverprofile=cover.out ./...
      - name: Coverage may not fall, see tools/coverage/README.md
        run: |
          set -o pipefail
          grep -vE '/gen/|/internal/testauth/' cover.out > cover.filtered
          pct=$(go tool cover -func=cover.filtered | awk '/^total:/ {print substr($3, 1, length($3) - 1)}')
          test -n "$pct"
          python3 ../../tools/coverage/coverage_gate.py go "$pct"
      - name: Login Token issued and redeemed on the pinned Keycloak image, decision A10
        working-directory: infra/compose
        run: ./a10-smoke.sh
      - name: The realm the stack built re-applies as a no-op, so no resource is re-created
        working-directory: infra/compose
        run: ./realm-noop.sh
      - name: Stack logs, only on failure because a passing run buries every step before it
        if: failure()
        working-directory: infra/compose
        run: |
          test -f .env || { echo "the stack never started; the real failure is above"; exit 0; }
          docker compose ps
          docker compose logs keycloak realm-apply members-migrate members notify-migrate notify mailpit bff
      - name: Teardown
        if: always()
        working-directory: infra/compose
        run: |
          test -f .env || exit 0
          docker compose --profile mail down -v

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ vars.IOS_RUNNER || 'macos-latest' }}
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SwiftLint, absent from the arm64 image macos-latest resolves to
        run: brew install swiftlint
      - name: SwiftFormat and SwiftLint
        working-directory: .
        run: |
          swiftformat --lint .
          swiftlint lint --strict
      - name: Build app and tests, instrumented for coverage on both halves of the split
        run: |
          xcodebuild build-for-testing -project MyMoneyRecap.xcodeproj -scheme MyMoneyRecap \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -enableCodeCoverage YES -quiet
      - name: Unit tests on a simulator picked by simctl at runtime, never a device name
        run: |
          xcodebuild test-without-building -project MyMoneyRecap.xcodeproj -scheme MyMoneyRecap \
            -destination "id=$(scripts/simulator-udid.sh)" -derivedDataPath build \
            -only-testing:MyMoneyRecapTests -enableCodeCoverage YES \
            -resultBundlePath build/MyMoneyRecap.xcresult
      - name: Coverage may not fall, see tools/coverage/README.md
        run: |
          set -o pipefail
          pct=$(xcrun xccov view --report --only-targets --json build/MyMoneyRecap.xcresult \
            | python3 ../../tools/coverage/xccov_percent.py)
          python3 ../../tools/coverage/coverage_gate.py ios "$pct"

  ci:
    name: all green
    if: always()
    needs: [changes, quality, design-system, contract, backend, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed or had nothing to do
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in
              success|skipped) ;;
              *) echo "a needed job reported: $result" && exit 1 ;;
            esac
          done
