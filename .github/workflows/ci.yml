name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every action is pinned to a commit, not a tag: a tag is mutable and whoever owns the action can
# repoint it at new code that runs with this job's token. Dependabot raises these (.github/dependabot.yml).
permissions:
  contents: read

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every hook except the ones needing a Go or Swift toolchain; those are gates in their own jobs.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: golangci-lint,gofmt,swiftlint,swiftformat,buf-lint

  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tokens and stylesheet are up to date with tokens.json
        run: |
          npm run build:tokens
          git diff --exit-code -- my-money-recap-ds/src/tokens my-money-recap-ds/src/styles
      - name: Swift tokens are up to date with tokens.json
        run: |
          npm run build:swift-tokens
          git diff --exit-code -- apps/ios/DesignSystem
      - name: Inlined artwork is up to date with assets/illustrations
        run: |
          npm run build:assets
          git diff --exit-code -- my-money-recap-ds/src/assets
      - run: npm run typecheck
      - name: Unit tests with coverage
        working-directory: my-money-recap-ds
        run: npm run test:coverage
      - name: Coverage may not fall (tools/coverage/README.md)
        run: |
          pct=$(python3 -c "import json;print(json.load(open('my-money-recap-ds/coverage/coverage-summary.json'))['total']['statements']['pct'])")
          python3 tools/coverage/coverage_gate.py typescript "$pct"

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contract
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: 1.73.0
          setup_only: true
      - run: buf lint
      - name: No breaking change against main (A1)
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          buf breaking --against "$(git rev-parse --git-common-dir)#ref=origin/main,subdir=packages/contract"
      - name: Generated Go and Swift code is up to date with the .proto files (the backend job compiles the Go)
        run: |
          buf generate
          git diff --exit-code -- ../../apps/backend/gen swift/Sources

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    # The stock .env.example ports and the throwaway credentials the step below writes (never committed).
    env:
      MEMBERS_TEST_URL: http://localhost:8081
      MEMBERS_TEST_DATABASE_URL: postgres://members:ci-throwaway@localhost:5432/members
      MEMBERS_TEST_KEYCLOAK: http://localhost:8080
      MEMBERS_TEST_USER_PASSWORD: ci-throwaway
      MEMBERS_TEST_BFF_CLIENT_SECRET: ci-throwaway
      BFF_TEST_URL: http://localhost:8082
      BFF_TEST_KEYCLOAK: http://localhost:8080
      BFF_TEST_USER_PASSWORD: ci-throwaway
      BFF_TEST_DATABASE_URL: postgres://members:ci-throwaway@localhost:5432/members
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          working-directory: apps/backend
          args: --config ../../.golangci.yml
      - name: Compose stack with the migration step, members and the BFF (#15, #17)
        working-directory: infra/compose
        run: |
          sed 's/=$/=ci-throwaway/' .env.example > .env
          docker compose up -d --build --wait
      - name: Unit tests, the Connect-boundary tests and the end-to-end test at the BFF's HTTP boundary
        # -p 1: the members and bff packages both sign in as the realm's one test user, so they must not run at once.
        run: |
          go vet ./...
          go test -v -p 1 -covermode=atomic -coverprofile=cover.out ./...
      - name: Coverage may not fall (tools/coverage/README.md)
        run: |
          # gen/ is buf's output and testauth is a test helper; neither is code anyone writes tests for.
          grep -vE '/gen/|/internal/testauth/' cover.out > cover.filtered
          pct=$(go tool cover -func=cover.filtered | awk '/^total:/ {print substr($3, 1, length($3) - 1)}')
          python3 ../../tools/coverage/coverage_gate.py go "$pct"
      - name: Login Token issued and redeemed on the pinned Keycloak image (A10)
        working-directory: infra/compose
        run: ./a10-smoke.sh
      - name: Stack logs and teardown
        if: always()
        working-directory: infra/compose
        run: |
          docker compose ps
          docker compose logs keycloak members-migrate members bff
          docker compose down -v

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # SwiftFormat ships with the macOS runner image; SwiftLint does not.
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftFormat and SwiftLint
        working-directory: .
        run: |
          swiftformat --lint .
          swiftlint lint --strict
      - name: Build the app and its tests for the generic iOS Simulator destination
        run: |
          xcodebuild build-for-testing -project MyMoneyRecap.xcodeproj -scheme MyMoneyRecap \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build -quiet
      - name: Unit tests on an iPhone simulator picked by simctl at runtime (issue #16, no device names)
        run: |
          xcodebuild test-without-building -project MyMoneyRecap.xcodeproj -scheme MyMoneyRecap \
            -destination "id=$(scripts/simulator-udid.sh)" -derivedDataPath build \
            -only-testing:MyMoneyRecapTests -enableCodeCoverage YES \
            -resultBundlePath build/MyMoneyRecap.xcresult
      - name: Coverage may not fall (tools/coverage/README.md)
        run: |
          # xccov_percent exits non-zero if the target is missing; reporting 0.0 would sail
          # through the gate forever, because the ios floor starts at 0.0.
          pct=$(xcrun xccov view --report --only-targets --json build/MyMoneyRecap.xcresult \
            | python3 ../../tools/coverage/xccov_percent.py)
          python3 ../../tools/coverage/coverage_gate.py ios "$pct"
