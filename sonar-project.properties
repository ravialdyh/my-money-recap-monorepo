sonar.projectKey=ravialdyh_my-money-recap-monorepo
sonar.organization=ravialdyh

sonar.sources=apps,packages,my-money-recap-ds/src,my-money-recap-ds/scripts,tools
sonar.tests=apps/ios/Tests,apps/ios/UITests
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*Tests.swift

# Generated, tool-owned and one-off asset tooling; the same set tools/policy/policy.json excludes.
sonar.exclusions=\
  apps/backend/gen/**,\
  packages/contract/swift/Sources/**,\
  apps/ios/DesignSystem/Tokens.swift,\
  apps/ios/**/*.xcodeproj/**,\
  my-money-recap-ds/src/styles/css.generated.ts,\
  my-money-recap-ds/src/assets/illustrations.ts,\
  my-money-recap-ds/.design-sync/**,\
  my-money-recap/**,\
  infra/compose/keycloak/mmr-realm.json,\
  docs/**,\
  **/node_modules/**

sonar.javascript.lcov.reportPaths=my-money-recap-ds/coverage/lcov.info
sonar.go.coverage.reportPaths=apps/backend/cover.filtered
