name: ${COMPOSE_PROJECT_NAME:-mmr}

x-migrate: &migrate
  pull_policy: never
  command: ["migrate"]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      MEMBERS_DB_PASSWORD: ${MEMBERS_DB_PASSWORD:?set in .env}
      NOTIFY_DB_PASSWORD: ${NOTIFY_DB_PASSWORD:?set in .env}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"], interval: 5s, timeout: 3s, retries: 12 }

  keycloak:
    image: quay.io/phasetwo/phasetwo-keycloak:26.6.6.1789466980
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_HOSTNAME: http://${MMR_HOST:-localhost}:${KEYCLOAK_HOST_PORT:-8080}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: ${KEYCLOAK_JAVA_HEAP:--XX:MaxRAMPercentage=70 -XX:MinRAMPercentage=70 -XX:InitialRAMPercentage=50}
      KC_BOOTSTRAP_ADMIN_USERNAME: &kc-admin admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: &kc-admin-password ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set in .env}
      KC_VAULT: file
      KC_VAULT_DIR: /run/secrets
      KC_SPI_VAULT__FILE__KEY_RESOLVERS: KEY_ONLY
    secrets:
      - { source: google_client_secret, target: google__client__secret }
      - { source: apple_sign_in_key, target: apple__sign__in__key }
    ports:
      - "${KEYCLOAK_HOST_PORT:-8080}:8080"
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3 && grep -q "\"status\": \"UP\"" <&3 && exec 4<>/dev/tcp/127.0.0.1/8080 && printf "GET /realms/master HTTP/1.0\r\n\r\n" >&4 && grep -q "\"realm\":\"master\"" <&4']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  realm-apply:
    image: ghcr.io/opentofu/opentofu:1.12.6
    entrypoint:
      - /bin/sh
      - -c
      - rm -f /state/*.tf && cp /realm/*.tf /realm/.terraform.lock.hcl /state/ && cd /state &&
        tofu init -input=false && tofu "$$@"
      - tofu
    command: ["apply", "-input=false", "-auto-approve"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: master
      KEYCLOAK_CLIENT_ID: admin-cli
      KEYCLOAK_USER: *kc-admin
      KEYCLOAK_PASSWORD: *kc-admin-password
      TF_VAR_ssl_required: ${REALM_SSL_REQUIRED:-none}
      TF_VAR_bff_client_secret: ${BFF_CLIENT_SECRET:?set in .env}
      TF_VAR_notify_client_secret: ${NOTIFY_CLIENT_SECRET:?set in .env}
      TF_VAR_members_client_secret: ${MEMBERS_CLIENT_SECRET:?set in .env}
      TF_VAR_test_user_password: ${TEST_USER_PASSWORD:-}
      TF_VAR_google_client_id: ${GOOGLE_CLIENT_ID:-replace-me}
      TF_VAR_apple_services_id: ${APPLE_SERVICES_ID:-replace-me}
      TF_VAR_apple_team_id: ${APPLE_TEAM_ID:-replace-me}
      TF_VAR_apple_sign_in_key_id: ${APPLE_SIGN_IN_KEY_ID:-replace-me}
    volumes:
      - ../tofu/realm:/realm:ro
      - realm-state:/state
    depends_on:
      keycloak:
        condition: service_healthy

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 12 }

  rabbitmq:
    image: rabbitmq:4-management
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mmr
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  members-migrate:
    <<: *migrate
    image: ${COMPOSE_PROJECT_NAME:-mmr}-members
    environment:
      MEMBERS_DATABASE_URL_FILE: &members-db-file /run/secrets/members_database_url
    secrets: [members_database_url]

  members:
    build: { context: ../../apps/backend, args: { CMD: members } }
    image: ${COMPOSE_PROJECT_NAME:-mmr}-members
    environment:
      MEMBERS_DATABASE_URL_FILE: *members-db-file
      MEMBERS_OIDC_ISSUER: &issuer http://${MMR_HOST:-localhost}:${KEYCLOAK_HOST_PORT:-8080}/realms/mmr
      MEMBERS_OIDC_JWKS_URL: &jwks http://keycloak:8080/realms/mmr/protocol/openid-connect/certs
      MEMBERS_AMQP_URL_FILE: &amqp-file /run/secrets/amqp_url
      MEMBERS_REALM_URL: &realm http://keycloak:8080/realms/mmr
      MEMBERS_REALM_ADMIN_URL: http://keycloak:8080/admin/realms/mmr
      MEMBERS_CLIENT_SECRET: ${MEMBERS_CLIENT_SECRET:?set in .env}
    ports:
      - "127.0.0.1:${MEMBERS_HOST_PORT:-8081}:8080"
    secrets: [members_database_url, amqp_url]
    depends_on:
      rabbitmq:
        condition: service_healthy
      members-migrate:
        condition: service_completed_successfully
      realm-apply:
        condition: service_completed_successfully
    healthcheck: &go-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31.2
    profiles: [mail]
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
    healthcheck: { test: ["CMD", "/mailpit", "readyz"], interval: 5s, timeout: 3s, retries: 12 }

  notify-migrate:
    <<: *migrate
    image: ${COMPOSE_PROJECT_NAME:-mmr}-notify
    environment:
      NOTIFY_DATABASE_URL_FILE: &notify-db-file /run/secrets/notify_database_url
    secrets: [notify_database_url]

  notify:
    build: { context: ../../apps/backend, args: { CMD: notify } }
    image: ${COMPOSE_PROJECT_NAME:-mmr}-notify
    environment:
      NOTIFY_DATABASE_URL_FILE: *notify-db-file
      NOTIFY_OIDC_ISSUER: *issuer
      NOTIFY_OIDC_JWKS_URL: *jwks
      NOTIFY_SMTP_ADDR: mailpit:1025
      NOTIFY_MAIL_FROM: no-reply@mymoneyrecap.test
      NOTIFY_MEMBERS_URL: http://members:8080
      NOTIFY_AMQP_URL_FILE: *amqp-file
      NOTIFY_LEDGER_URL: http://ledger:8080
      NOTIFY_REALM_URL: *realm
      NOTIFY_CLIENT_SECRET: ${NOTIFY_CLIENT_SECRET:?set in .env}
      NOTIFY_APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      NOTIFY_APPLE_PUSH_KEY_ID: ${APPLE_PUSH_KEY_ID:-}
      NOTIFY_APPLE_PUSH_KEY: ${APPLE_PUSH_KEY:-}
    ports:
      - "127.0.0.1:${NOTIFY_HOST_PORT:-8083}:8080"
    secrets: [notify_database_url, amqp_url]
    depends_on:
      rabbitmq: { condition: service_healthy }
      notify-migrate: { condition: service_completed_successfully }
      realm-apply: { condition: service_completed_successfully }
    healthcheck: *go-healthcheck

  ledger-migrate:
    <<: *migrate
    image: ${COMPOSE_PROJECT_NAME:-mmr}-ledger
    environment:
      LEDGER_DATABASE_URL_FILE: &ledger-db-file /run/secrets/ledger_database_url
    secrets: [ledger_database_url]

  ledger:
    build: { context: ../../apps/backend, args: { CMD: ledger } }
    image: ${COMPOSE_PROJECT_NAME:-mmr}-ledger
    environment:
      LEDGER_DATABASE_URL_FILE: *ledger-db-file
      LEDGER_OIDC_ISSUER: *issuer
      LEDGER_OIDC_JWKS_URL: *jwks
      LEDGER_MEMBERS_URL: http://members:8080
      LEDGER_AMQP_URL_FILE: *amqp-file
    ports:
      - "127.0.0.1:${LEDGER_HOST_PORT:-8084}:8080"
    secrets: [ledger_database_url, amqp_url]
    depends_on:
      rabbitmq:
        condition: service_healthy
      ledger-migrate:
        condition: service_completed_successfully
      realm-apply:
        condition: service_completed_successfully
      members:
        condition: service_healthy
    healthcheck: *go-healthcheck

  bff:
    build: { context: ../../apps/backend, args: { CMD: bff } }
    image: ${COMPOSE_PROJECT_NAME:-mmr}-bff
    environment:
      BFF_OIDC_ISSUER: *issuer
      BFF_OIDC_JWKS_URL: *jwks
      BFF_MEMBERS_URL: http://members:8080
      BFF_LEDGER_URL: http://ledger:8080
      BFF_NOTIFY_URL: http://notify:8080
      BFF_REALM_URL: http://keycloak:8080/realms/mmr
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?set in .env}
      BFF_MAGIC_LINK_BASE_URL: http://${MMR_HOST:-localhost}:${NGINX_HOST_PORT:-8090}/magic
      BFF_REDIS_ADDR: redis:6379
      BFF_CURRENCY_URL: http://currency:8080
    ports:
      - "${BFF_HOST_PORT:-8082}:8080"
    depends_on:
      ledger:
        condition: service_healthy
      redis:
        condition: service_healthy
      realm-apply:
        condition: service_completed_successfully
    healthcheck: *go-healthcheck

  currency:
    build: { context: ../../apps/backend, args: { CMD: currency } }
    image: ${COMPOSE_PROJECT_NAME:-mmr}-currency
    environment:
      CURRENCY_OIDC_ISSUER: *issuer
      CURRENCY_OIDC_JWKS_URL: *jwks
      CURRENCY_REDIS_ADDR: redis:6379
      CURRENCY_OPEN_EXCHANGE_RATES_APP_ID: ${OPEN_EXCHANGE_RATES_APP_ID:-}
    ports: ["127.0.0.1:${CURRENCY_HOST_PORT:-8085}:8080"]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck: *go-healthcheck

  nginx:
    image: nginx:stable
    ports:
      - "${NGINX_HOST_PORT:-8090}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/html:/usr/share/nginx/html:ro
      - acme-certs:/etc/nginx/certs:ro
    depends_on:
      bff:
        condition: service_healthy
        restart: true
      keycloak:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/magic"]
      interval: 5s
      timeout: 3s
      retries: 12

  acme:
    image: neilpang/acme.sh:3.1.6
    command: ["daemon"]
    volumes:
      - acme-certs:/certs
      - acme-config:/acme.sh

secrets:
  members_database_url:
    environment: MEMBERS_DATABASE_URL
  notify_database_url:
    environment: NOTIFY_DATABASE_URL
  ledger_database_url:
    environment: LEDGER_DATABASE_URL
  amqp_url:
    environment: AMQP_URL
  google_client_secret:
    file: vault/google_client_secret
  apple_sign_in_key:
    file: vault/apple_sign_in_key

volumes:
  postgres-data:
  rabbitmq-data:
  realm-state:
  acme-certs:
  acme-config:
