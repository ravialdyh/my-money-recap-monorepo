name: ${COMPOSE_PROJECT_NAME:-mmr}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      MEMBERS_DB_PASSWORD: ${MEMBERS_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/phasetwo/phasetwo-keycloak:${KEYCLOAK_TAG:-26.6.6.1789466980}
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_HOSTNAME: http://${MMR_HOST:-localhost}:${KEYCLOAK_HOST_PORT:-8080}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set in .env}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:?set in .env}
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?set in .env}
    ports:
      - "${KEYCLOAK_HOST_PORT:-8080}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3 && grep -q "\"status\": \"UP\"" <&3 && exec 4<>/dev/tcp/127.0.0.1/8080 && printf "GET /realms/mmr HTTP/1.0\r\n\r\n" >&4 && grep -q "\"realm\":\"mmr\"" <&4']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  rabbitmq:
    image: rabbitmq:4-management
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  members-migrate:
    image: ${COMPOSE_PROJECT_NAME:-mmr}-members
    pull_policy: never
    command: ["migrate"]
    environment:
      MEMBERS_DATABASE_URL: &members-db postgres://members:${MEMBERS_DB_PASSWORD:?set in .env}@postgres:5432/members
    depends_on:
      postgres:
        condition: service_healthy

  members:
    build:
      context: ../../apps/backend
      args: { CMD: members }
    image: ${COMPOSE_PROJECT_NAME:-mmr}-members
    environment:
      MEMBERS_DATABASE_URL: *members-db
      MEMBERS_OIDC_ISSUER: &issuer http://${MMR_HOST:-localhost}:${KEYCLOAK_HOST_PORT:-8080}/realms/mmr
      MEMBERS_OIDC_JWKS_URL: &jwks http://keycloak:8080/realms/mmr/protocol/openid-connect/certs
      MEMBERS_OIDC_AUDIENCE: bff
    ports:
      - "127.0.0.1:${MEMBERS_HOST_PORT:-8081}:8080"
    depends_on:
      members-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck: &go-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  bff:
    build:
      context: ../../apps/backend
      args: { CMD: bff }
    image: ${COMPOSE_PROJECT_NAME:-mmr}-bff
    environment:
      BFF_OIDC_ISSUER: *issuer
      BFF_OIDC_JWKS_URL: *jwks
      BFF_OIDC_AUDIENCE: bff
      BFF_MEMBERS_URL: http://members:8080
    ports:
      - "${BFF_HOST_PORT:-8082}:8080"
    depends_on:
      members:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck: *go-healthcheck

volumes:
  postgres-data:
  rabbitmq-data:
