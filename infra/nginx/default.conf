limit_req_zone $binary_remote_addr zone=mmr_api:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=mmr_magic:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=mmr_conn:10m;

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /.well-known/apple-app-site-association {
        root /usr/share/nginx/html;
        default_type application/json;
        try_files /apple-app-site-association =404;
    }

    location = /magic {
        root /usr/share/nginx/html;
        try_files /magic.html =404;
    }

    location = /api/money_recap.v1.BffService/RequestMagicLink {
        limit_req zone=mmr_magic burst=4 nodelay;
        limit_req zone=mmr_api burst=120 nodelay;
        limit_conn mmr_conn 100;
        proxy_pass http://bff:8080/money_recap.v1.BffService/RequestMagicLink;
    }

    location /api/ {
        limit_req zone=mmr_api burst=120 nodelay;
        limit_conn mmr_conn 100;
        proxy_pass http://bff:8080/;
    }

    location /auth/ {
        limit_req zone=mmr_api burst=120 nodelay;
        limit_conn mmr_conn 100;
        proxy_pass http://keycloak:8080/;
    }

    location / {
        return 404;
    }
}
