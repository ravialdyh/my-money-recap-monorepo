<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My Money Recap</title>
<style>
  :root {
    --ground-recap: #5B4FE8;
    --white: #FFFFFF;
    --display: Fredoka, "Arial Rounded MT Bold", Nunito, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ground-recap);
    color: var(--white);
    font-family: var(--display);
    text-align: center;
  }
  main { padding: 24px; max-width: 34rem; }
  svg { width: 200px; height: auto; }
  h1 {
    margin: 24px 0 0;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.04;
    letter-spacing: -0.01em;
  }
  @media (max-width: 420px) {
    svg { width: 148px; }
    h1 { font-size: 32px; }
  }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 200 160" role="img" aria-label="An envelope">
    <path d="M18 64 100 12l82 52v78a6 6 0 0 1-6 6H24a6 6 0 0 1-6-6z" fill="#F6ECDC"/>
    <rect x="46" y="30" width="108" height="86" rx="6" fill="#FFFFFF"/>
    <circle cx="100" cy="73" r="26" fill="#F7C948"/>
    <circle cx="100" cy="73" r="18" fill="none" stroke="#E8A317" stroke-width="4"/>
    <path d="M18 64v78a6 6 0 0 0 6 6h152a6 6 0 0 0 6-6V64l-82 50z" fill="#EADCC6"/>
    <path d="M18 142a6 6 0 0 0 6 6h152a6 6 0 0 0 6-6l-82-50z" fill="#F6ECDC"/>
  </svg>
  <h1>Open My Money Recap on your phone to finish signing in.</h1>
</main>
</body>
</html>
